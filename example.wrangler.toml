name = "cloudflare-worker-token-service"
main = "src/index.ts"
compatibility_date = "2022-06-14"

kv_namespaces = [
  { binding = "TOKEN_URLS", id = "", preview_id = "" }
]

# Per client id and caller IP on the client_credentials grant. Each app needs
# about one app token a day; the headroom is for IPs shared by many people
# (mobile carriers, offices, schools).
[[ratelimits]]
name = "CLIENT_CREDENTIALS_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
